basePath: /
definitions:
  domain.AdminContribution:
    properties:
      audio_url:
        type: string
      category:
        type: string
      contributor_id:
        type: integer
      contributor_name:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      item_language:
        type: string
      item_text:
        description: ItemText is the segment translated or the prompt answered, in
          ItemLanguage.
        type: string
      kind:
        type: string
      language_code:
        type: string
      modality:
        type: string
      pasted:
        type: boolean
      read_text:
        description: ReadText is, for a recording, the verified translation it reads.
        type: string
      review:
        allOf:
        - $ref: '#/definitions/domain.AdminReview'
        description: nil while pending
      source_title:
        type: string
      status:
        type: string
      submitted_at:
        type: string
      text:
        description: Text is what the volunteer wrote; "" for a recording.
        type: string
      video_url:
        description: for a sign
        type: string
    type: object
  domain.AdminReview:
    properties:
      corrected_text:
        type: string
      decision:
        type: string
      note:
        type: string
      reason:
        type: string
      reviewed_at:
        type: string
      reviewer_id:
        type: integer
      reviewer_name:
        type: string
    type: object
  domain.Membership:
    properties:
      language_code:
        type: string
      level:
        type: string
      modality:
        description: 'Modality is the language''s: spoken or signed.'
        type: string
    type: object
  domain.TranslatorLanguage:
    properties:
      contributions:
        type: integer
      language_code:
        type: string
      level:
        type: string
    type: object
  handlers.AdminContributionPageAlias:
    properties:
      contributions:
        items:
          $ref: '#/definitions/domain.AdminContribution'
        type: array
      total:
        type: integer
    type: object
  handlers.ContributionAlias:
    properties:
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      language_code:
        type: string
      modality:
        type: string
      pasted:
        type: boolean
      status:
        type: string
      text:
        description: '"" for a recording: the text it reads is its transcript'
        type: string
    type: object
  handlers.FirebaseToken:
    properties:
      claims:
        additionalProperties: {}
        type: object
      email:
        type: string
      name:
        type: string
      photoUrl:
        type: string
      uid:
        type: string
    type: object
  handlers.HealthStats:
    properties:
      error:
        type: string
      idle:
        type: integer
      in_use:
        type: integer
      max_idle_closed:
        type: integer
      max_lifetime_closed:
        type: integer
      message:
        type: string
      open_connections:
        type: integer
      status:
        type: string
      wait_count:
        type: integer
      wait_duration:
        type: string
    type: object
  handlers.LanguageAlias:
    properties:
      code:
        type: string
      extra_characters:
        items:
          type: string
        type: array
      modality:
        description: spoken or signed
        type: string
      name:
        type: string
      native_name:
        type: string
      role:
        type: string
      script:
        type: string
    type: object
  handlers.LanguageProgressAlias:
    properties:
      available:
        description: translate items, the whole every language works from; for a sign
          language, words and sentences to sign
        type: integer
      code:
        type: string
      pending:
        description: contributions of any kind awaiting review
        type: integer
      recorded:
        description: Recordings, of any kind of item, pending review or verified,
          and verified.
        type: integer
      recorded_verified:
        type: integer
      signed:
        description: Signs recorded on video, pending review or verified, and verified.
        type: integer
      signed_verified:
        type: integer
      translated:
        description: pairs pending review or verified
        type: integer
      verified:
        description: pairs a second speaker approved
        type: integer
    type: object
  handlers.RecordingUploadAlias:
    properties:
      content_type:
        type: string
      key:
        type: string
      landmarks_content_type:
        type: string
      landmarks_key:
        type: string
      landmarks_upload_url:
        type: string
      upload_url:
        type: string
    type: object
  handlers.ReviewItemAlias:
    properties:
      audio_url:
        description: where the reviewer plays a recording
        type: string
      category:
        type: string
      contribution_id:
        type: integer
      item_language:
        type: string
      item_text:
        type: string
      kind:
        type: string
      landmarks_url:
        description: the sign's tracked landmarks, when recorded
        type: string
      language_code:
        type: string
      modality:
        type: string
      pasted:
        type: boolean
      read_text:
        description: 'for a recording: the verified translation it reads'
        type: string
      submitted_at:
        type: string
      text:
        description: '"" for a recording'
        type: string
      video_url:
        description: where the reviewer watches a sign
        type: string
    type: object
  handlers.TaskAlias:
    properties:
      category:
        type: string
      item_id:
        type: integer
      kind:
        type: string
      modality:
        description: 'text: write it; audio: read it aloud; video: sign it'
        type: string
      target_language:
        description: language the volunteer writes, speaks or signs in
        type: string
      text:
        description: the segment to translate, prompt to answer, or word to sign;
          for a recording, the verified translation to read
        type: string
      text_language:
        description: language Text is written in
        type: string
    type: object
  handlers.TranslatorAlias:
    properties:
      corrected:
        type: integer
      email:
        type: string
      id:
        type: integer
      joined_at:
        type: string
      languages:
        items:
          $ref: '#/definitions/domain.TranslatorLanguage'
        type: array
      last_active_at:
        description: LastActiveAt is their latest contribution or review; nil when
          none.
        type: string
      name:
        type: string
      pending:
        description: |-
          The same contributions by status. Corrected counts the verified ones a
          reviewer corrected, so it is part of Verified.
        type: integer
      recorded:
        type: integer
      rejected:
        type: integer
      reviewed:
        description: Reviewed counts the reviews they made of other volunteers' work.
        type: integer
      signed:
        type: integer
      verified:
        type: integer
      written:
        description: 'Their contributions: written (translations and answers), recorded,
          and signed.'
        type: integer
    type: object
  handlers.UserAlias:
    properties:
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      id:
        type: integer
      name:
        type: string
      photo_url:
        type: string
      updated_at:
        type: string
    type: object
  handlers.VolunteerAlias:
    properties:
      consent_version:
        description: latest accepted, "" if none
        type: string
      email:
        type: string
      id:
        type: integer
      languages:
        items:
          $ref: '#/definitions/domain.Membership'
        type: array
      name:
        type: string
      video_consent:
        description: VideoConsent reports whether it covers signing on camera (ADR
          0014).
        type: boolean
      voice_consent:
        description: |-
          VoiceConsent reports whether that consent also covers voice recordings,
          which volunteers accept separately before recording.
        type: boolean
    type: object
  handlers.contributionRequest:
    properties:
      audio_key:
        description: AudioKey is the key StartRecording returned, for a recording.
        type: string
      item_id:
        type: integer
      landmarks_key:
        description: |-
          LandmarksKey is the landmarks_key StartRecording returned, for a sign
          whose landmarks were tracked and uploaded; leave it empty otherwise.
        type: string
      language:
        type: string
      modality:
        description: |-
          Modality is "text" (the default) or "audio" in a spoken language, and
          "video" (the default) in a sign language.
        type: string
      pasted:
        type: boolean
      text:
        description: |-
          Text is the written contribution; ignored for a recording, whose
          transcript is the verified translation it reads.
        type: string
      video_key:
        description: VideoKey is the key StartRecording returned, for a sign.
        type: string
    required:
    - item_id
    - language
    type: object
  handlers.featuresResponse:
    properties:
      video:
        description: Video is true when signs can be recorded on camera; it needs
          the same storage.
        type: boolean
      voice:
        description: Voice is true when recordings can be stored (object storage is
          set up).
        type: boolean
    type: object
  handlers.onboardingRequest:
    properties:
      consent_version:
        type: string
      languages:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.recordingRequest:
    properties:
      content_type:
        type: string
      item_id:
        type: integer
      language:
        type: string
    required:
    - content_type
    - item_id
    - language
    type: object
  handlers.reviewRequest:
    properties:
      contribution_id:
        type: integer
      corrected_text:
        type: string
      decision:
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - contribution_id
    - decision
    type: object
  handlers.updateMeRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: CommonMind Data Lab REST API.
  title: CommonMind API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hello World
      tags:
      - general
  /admin/queues:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: Asynqmon UI
          schema:
            type: string
      summary: Asynq job monitoring UI
      tags:
      - observability
  /api/v1/admin/data-lab/contributions:
    get:
      description: Contributions newest first, each with the item's text beside what
        the volunteer entered, and its review. total counts every match.
      parameters:
      - description: Volunteer ID
        in: query
        name: contributor
        type: integer
      - description: Target language code
        in: query
        name: language
        type: string
      - description: pending, verified, or rejected
        in: query
        name: status
        type: string
      - description: text, audio, or video
        in: query
        name: modality
        type: string
      - description: 'Page size: 50 by default, at most 200'
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AdminContributionPageAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminPassword: []
      summary: List contributions (admin)
      tags:
      - admin
  /api/v1/admin/data-lab/translators:
    get:
      description: Every volunteer who joined a language or contributed, most contributions
        first, with their counts by modality and status and the reviews they made.
        language narrows the list and the counts to one language.
      parameters:
      - description: Target language code, e.g. sw
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TranslatorAlias'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminPassword: []
      summary: List translators (admin)
      tags:
      - admin
  /api/v1/admin/data-lab/translators/{id}:
    get:
      description: One volunteer with their counts across every language.
      parameters:
      - description: Volunteer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TranslatorAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AdminPassword: []
      summary: Get one translator (admin)
      tags:
      - admin
  /api/v1/data-lab/consent/video:
    post:
      description: Extends the volunteer's current consent to video recordings of
        their signing, which show their face and hands and are published with the
        dataset. Needed before recording in a sign language.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: onboarding_required or consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agree to sign on camera
      tags:
      - data-lab
  /api/v1/data-lab/consent/voice:
    post:
      description: Extends the volunteer's current consent to voice recordings, which
        are published with the dataset. Needed before recording.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: onboarding_required or consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agree to record your voice
      tags:
      - data-lab
  /api/v1/data-lab/contributions:
    post:
      consumes:
      - application/json
      description: Saves a translation or answer as pending review, written or recorded.
        A recording (modality=audio) reads the item's verified translation aloud and
        carries the audio_key it was uploaded to. A sign (modality=video) carries
        its video_key and, when tracked, its landmarks_key. `pasted` is set by the
        editor when text was pasted in.
      parameters:
      - description: Contribution
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.contributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ContributionAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_contributed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit a contribution
      tags:
      - data-lab
  /api/v1/data-lab/features:
    get:
      description: 'Which optional features this server has: voice and video are true
        when recordings can be stored.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.featuresResponse'
      summary: Data Lab features
      tags:
      - data-lab
  /api/v1/data-lab/languages:
    get:
      description: 'Returns the enabled languages: the target languages volunteers
        contribute in, then the source languages.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Data Lab languages
      tags:
      - data-lab
  /api/v1/data-lab/me:
    get:
      description: Returns the volunteer's languages, levels, and consent. 403 onboarding_required
        when they have not joined yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my Data Lab profile
      tags:
      - data-lab
  /api/v1/data-lab/onboarding:
    post:
      consumes:
      - application/json
      description: Records the volunteer's name, languages, and acceptance of the
        current consent. Calling it again adds languages and never lowers a level.
      parameters:
      - description: Onboarding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.onboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Join the Data Lab or add languages
      tags:
      - data-lab
  /api/v1/data-lab/progress:
    get:
      description: Verified and pending counts, members, reviewers, and whether each
        target language is open. Signed-in clients also receive data-lab.progress
        messages on /ws as counts change.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageProgressAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Live progress per language
      tags:
      - data-lab
  /api/v1/data-lab/recordings:
    post:
      consumes:
      - application/json
      description: 'Returns a presigned URL (valid 15 minutes) the browser PUTs the
        recording to, with the returned content_type, then the key to submit with
        the contribution. In a spoken language: an audio recording, which needs voice
        consent and a verified translation of the item in the language. In a sign
        language: a video, which needs video consent, plus a second URL for the landmarks
        file (application/json) tracked while recording.'
      parameters:
      - description: Recording
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.recordingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RecordingUploadAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: voice_consent_required or video_consent_required
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: voice_unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a URL to upload a recording to
      tags:
      - data-lab
  /api/v1/data-lab/reviews:
    post:
      consumes:
      - application/json
      description: Accept verifies the contribution. Correct verifies written text
        with the reviewer's corrected_text, keeping the original on the contribution;
        recordings and signs can't be corrected. Reject needs a reason (inaccurate,
        incomplete, machine_translated, off_topic, unclear, other) and reopens the
        item for others.
      parameters:
      - description: Review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.reviewRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not_reviewer or own_contribution
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_reviewed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Review a contribution
      tags:
      - data-lab
  /api/v1/data-lab/reviews/next:
    get:
      description: Returns the oldest pending contribution in the language by someone
        else. A recording comes with audio_url to play it and read_text, the verified
        translation it reads. A sign comes with video_url and, when tracked, landmarks_url.
        404 no_reviews when the queue is empty.
      parameters:
      - description: Language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReviewItemAlias'
        "403":
          description: not_reviewer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_reviews
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next contribution to review
      tags:
      - data-lab
  /api/v1/data-lab/tasks/next:
    get:
      description: 'In a spoken language, modality=text (the default) returns an item
        to translate or a prompt to answer, and modality=audio a verified translation
        in the language to read aloud: only translated, verified items are recorded.
        In a sign language, modality=video (its default and only modality) returns
        an English word or sentence to sign, words first. 404 no_tasks when the language
        has nothing left for this volunteer.'
      parameters:
      - description: Target language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      - description: text (default) or audio; video for a sign language
        in: query
        name: modality
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskAlias'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_tasks
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: voice_unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next task in a language
      tags:
      - data-lab
  /api/v1/me:
    delete:
      description: Removes the authenticated user's profile record from the database.
        The Firebase account is not deleted.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - users
    get:
      description: 'Returns the authenticated Firebase user''s decoded claims. Requires
        Authorization: Bearer <firebase-id-token>.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FirebaseToken'
        "401":
          description: Missing or invalid token
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Upserts the authenticated user's profile record. Requires a valid
        Firebase ID token.
      parameters:
      - description: Profile update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthStats'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.HealthStats'
      summary: Health check
      tags:
      - ops
  /metrics:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus exposition format
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - observability
  /ws:
    get:
      description: Upgrades HTTP to WebSocket. Pass a Firebase ID token as `?token=<token>`.
        Returns 401 when the token is missing or invalid.
      parameters:
      - description: Firebase ID token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a WebSocket connection
      tags:
      - websocket
securityDefinitions:
  AdminPassword:
    description: The Data Lab admin's ADMIN_PASSWORD — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: Firebase ID token — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
