basePath: /
definitions:
  domain.Membership:
    properties:
      language_code:
        type: string
      level:
        type: string
    type: object
  handlers.ContributionAlias:
    properties:
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      language_code:
        type: string
      pasted:
        type: boolean
      status:
        type: string
      text:
        type: string
    type: object
  handlers.FirebaseToken:
    properties:
      claims:
        additionalProperties: {}
        type: object
      email:
        type: string
      name:
        type: string
      photoUrl:
        type: string
      uid:
        type: string
    type: object
  handlers.HealthStats:
    properties:
      error:
        type: string
      idle:
        type: integer
      in_use:
        type: integer
      max_idle_closed:
        type: integer
      max_lifetime_closed:
        type: integer
      message:
        type: string
      open_connections:
        type: integer
      status:
        type: string
      wait_count:
        type: integer
      wait_duration:
        type: string
    type: object
  handlers.LanguageAlias:
    properties:
      code:
        type: string
      extra_characters:
        items:
          type: string
        type: array
      name:
        type: string
      native_name:
        type: string
      role:
        type: string
      script:
        type: string
    type: object
  handlers.LanguageProgressAlias:
    properties:
      code:
        type: string
      contributors:
        description: members at any level
        type: integer
      open:
        description: enough reviewers to accept contributions
        type: boolean
      pending:
        type: integer
      reviewers:
        description: reviewers and leads
        type: integer
      verified:
        type: integer
    type: object
  handlers.ReviewItemAlias:
    properties:
      category:
        type: string
      contribution_id:
        type: integer
      item_language:
        type: string
      item_text:
        type: string
      kind:
        type: string
      language_code:
        type: string
      pasted:
        type: boolean
      submitted_at:
        type: string
      text:
        type: string
    type: object
  handlers.TaskAlias:
    properties:
      category:
        type: string
      item_id:
        type: integer
      kind:
        type: string
      target_language:
        description: language the volunteer writes in
        type: string
      text:
        description: the segment to translate, or the prompt to answer
        type: string
      text_language:
        description: language Text is written in
        type: string
    type: object
  handlers.UserAlias:
    properties:
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      id:
        type: integer
      name:
        type: string
      photo_url:
        type: string
      updated_at:
        type: string
    type: object
  handlers.VolunteerAlias:
    properties:
      consent_version:
        description: latest accepted, "" if none
        type: string
      email:
        type: string
      id:
        type: integer
      languages:
        items:
          $ref: '#/definitions/domain.Membership'
        type: array
      name:
        type: string
    type: object
  handlers.contributionRequest:
    properties:
      item_id:
        type: integer
      language:
        type: string
      pasted:
        type: boolean
      text:
        type: string
    required:
    - item_id
    - language
    type: object
  handlers.onboardingRequest:
    properties:
      consent_version:
        type: string
      languages:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.presignRequest:
    properties:
      content_type:
        type: string
      filename:
        type: string
    required:
    - content_type
    - filename
    type: object
  handlers.presignResponse:
    properties:
      public_url:
        type: string
      upload_url:
        type: string
    type: object
  handlers.reviewRequest:
    properties:
      contribution_id:
        type: integer
      decision:
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - contribution_id
    - decision
    type: object
  handlers.updateMeRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: CommonMind Data Lab REST API.
  title: CommonMind API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hello World
      tags:
      - general
  /admin/queues:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: Asynqmon UI
          schema:
            type: string
      summary: Asynq job monitoring UI
      tags:
      - observability
  /api/v1/data-lab/contributions:
    post:
      consumes:
      - application/json
      description: Saves a translation or answer as pending review. `pasted` is set
        by the editor when text was pasted in.
      parameters:
      - description: Contribution
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.contributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ContributionAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_contributed or language_closed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit a contribution
      tags:
      - data-lab
  /api/v1/data-lab/languages:
    get:
      description: 'Returns the enabled languages: the target languages volunteers
        contribute in, then the source languages.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Data Lab languages
      tags:
      - data-lab
  /api/v1/data-lab/me:
    get:
      description: Returns the volunteer's languages, levels, and consent. 403 onboarding_required
        when they have not joined yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my Data Lab profile
      tags:
      - data-lab
  /api/v1/data-lab/onboarding:
    post:
      consumes:
      - application/json
      description: Records the volunteer's name, languages, and acceptance of the
        current consent. Calling it again adds languages and never lowers a level.
      parameters:
      - description: Onboarding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.onboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Join the Data Lab or add languages
      tags:
      - data-lab
  /api/v1/data-lab/progress:
    get:
      description: Verified and pending counts, members, reviewers, and whether each
        target language is open. Signed-in clients also receive data-lab.progress
        messages on /ws as counts change.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageProgressAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Live progress per language
      tags:
      - data-lab
  /api/v1/data-lab/reviews:
    post:
      consumes:
      - application/json
      description: Accept verifies the contribution; reject needs a reason (inaccurate,
        incomplete, machine_translated, off_topic, other) and reopens the item for
        others.
      parameters:
      - description: Review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.reviewRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not_reviewer or own_contribution
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_reviewed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Review a contribution
      tags:
      - data-lab
  /api/v1/data-lab/reviews/next:
    get:
      description: Returns the oldest pending contribution in the language written
        by someone else. 404 no_reviews when the queue is empty.
      parameters:
      - description: Language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReviewItemAlias'
        "403":
          description: not_reviewer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_reviews
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next contribution to review
      tags:
      - data-lab
  /api/v1/data-lab/tasks/next:
    get:
      description: Returns an item to translate or a prompt to answer. 404 no_tasks
        when the language has nothing left for this volunteer; 409 language_closed
        until it has two reviewers.
      parameters:
      - description: Target language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskAlias'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_tasks
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: language_closed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next task in a language
      tags:
      - data-lab
  /api/v1/me:
    delete:
      description: Removes the authenticated user's profile record from the database.
        The Firebase account is not deleted.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - users
    get:
      description: 'Returns the authenticated Firebase user''s decoded claims. Requires
        Authorization: Bearer <firebase-id-token>.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FirebaseToken'
        "401":
          description: Missing or invalid token
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Upserts the authenticated user's profile record. Requires a valid
        Firebase ID token.
      parameters:
      - description: Profile update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /api/v1/storage/{key}:
    delete:
      parameters:
      - description: Object key
        in: path
        name: key
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a stored object
      tags:
      - storage
  /api/v1/storage/presign:
    post:
      consumes:
      - application/json
      description: Returns a presigned PUT URL and the final public URL. The client
        uploads directly to R2 using the presigned URL.
      parameters:
      - description: Upload request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.presignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.presignResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Request a presigned upload URL
      tags:
      - storage
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthStats'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.HealthStats'
      summary: Health check
      tags:
      - ops
  /metrics:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus exposition format
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - observability
  /ws:
    get:
      description: Upgrades HTTP to WebSocket. Pass a Firebase ID token as `?token=<token>`.
        Returns 401 when the token is missing or invalid.
      parameters:
      - description: Firebase ID token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a WebSocket connection
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    description: Firebase ID token — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
