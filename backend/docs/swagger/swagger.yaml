basePath: /
definitions:
  domain.Membership:
    properties:
      language_code:
        type: string
      level:
        type: string
    type: object
  handlers.ContributionAlias:
    properties:
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      language_code:
        type: string
      modality:
        type: string
      pasted:
        type: boolean
      status:
        type: string
      text:
        description: for a recording, its transcript ("" if none)
        type: string
    type: object
  handlers.FirebaseToken:
    properties:
      claims:
        additionalProperties: {}
        type: object
      email:
        type: string
      name:
        type: string
      photoUrl:
        type: string
      uid:
        type: string
    type: object
  handlers.HealthStats:
    properties:
      error:
        type: string
      idle:
        type: integer
      in_use:
        type: integer
      max_idle_closed:
        type: integer
      max_lifetime_closed:
        type: integer
      message:
        type: string
      open_connections:
        type: integer
      status:
        type: string
      wait_count:
        type: integer
      wait_duration:
        type: string
    type: object
  handlers.LanguageAlias:
    properties:
      code:
        type: string
      extra_characters:
        items:
          type: string
        type: array
      name:
        type: string
      native_name:
        type: string
      role:
        type: string
      script:
        type: string
    type: object
  handlers.LanguageProgressAlias:
    properties:
      available:
        description: translate items, the whole every language works from
        type: integer
      code:
        type: string
      open:
        description: enough reviewers to accept contributions
        type: boolean
      pending:
        description: contributions of any kind awaiting review
        type: integer
      recorded:
        description: Recordings, of any kind of item, pending review or verified,
          and verified.
        type: integer
      recorded_verified:
        type: integer
      translated:
        description: pairs pending review or verified
        type: integer
      verified:
        description: pairs a second speaker approved
        type: integer
    type: object
  handlers.RecordingUploadAlias:
    properties:
      content_type:
        type: string
      key:
        type: string
      upload_url:
        type: string
    type: object
  handlers.ReviewItemAlias:
    properties:
      audio_url:
        description: where the reviewer plays a recording
        type: string
      category:
        type: string
      contribution_id:
        type: integer
      item_language:
        type: string
      item_text:
        type: string
      kind:
        type: string
      language_code:
        type: string
      modality:
        type: string
      pasted:
        type: boolean
      submitted_at:
        type: string
      text:
        description: for a recording, its transcript ("" if none)
        type: string
    type: object
  handlers.TaskAlias:
    properties:
      category:
        type: string
      item_id:
        type: integer
      kind:
        type: string
      modality:
        description: 'text: write it; audio: say it'
        type: string
      target_language:
        description: language the volunteer writes in
        type: string
      text:
        description: the segment to translate, or the prompt to answer
        type: string
      text_language:
        description: language Text is written in
        type: string
    type: object
  handlers.UserAlias:
    properties:
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      id:
        type: integer
      name:
        type: string
      photo_url:
        type: string
      updated_at:
        type: string
    type: object
  handlers.VolunteerAlias:
    properties:
      consent_version:
        description: latest accepted, "" if none
        type: string
      email:
        type: string
      id:
        type: integer
      languages:
        items:
          $ref: '#/definitions/domain.Membership'
        type: array
      name:
        type: string
      voice_consent:
        description: |-
          VoiceConsent reports whether that consent also covers voice recordings,
          which volunteers accept separately before recording.
        type: boolean
    type: object
  handlers.contributionRequest:
    properties:
      audio_key:
        description: AudioKey is the key StartRecording returned, for a recording.
        type: string
      item_id:
        type: integer
      language:
        type: string
      modality:
        description: Modality is "text" (the default) or "audio".
        type: string
      pasted:
        type: boolean
      text:
        description: Text is the written contribution, or a recording's optional transcript.
        type: string
    required:
    - item_id
    - language
    type: object
  handlers.featuresResponse:
    properties:
      voice:
        description: Voice is true when recordings can be stored (object storage is
          set up).
        type: boolean
    type: object
  handlers.onboardingRequest:
    properties:
      consent_version:
        type: string
      languages:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.recordingRequest:
    properties:
      content_type:
        type: string
      item_id:
        type: integer
      language:
        type: string
    required:
    - content_type
    - item_id
    - language
    type: object
  handlers.reviewRequest:
    properties:
      contribution_id:
        type: integer
      corrected_text:
        type: string
      decision:
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - contribution_id
    - decision
    type: object
  handlers.updateMeRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: CommonMind Data Lab REST API.
  title: CommonMind API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hello World
      tags:
      - general
  /admin/queues:
    get:
      produces:
      - text/html
      responses:
        "200":
          description: Asynqmon UI
          schema:
            type: string
      summary: Asynq job monitoring UI
      tags:
      - observability
  /api/v1/data-lab/consent/voice:
    post:
      description: Extends the volunteer's current consent to voice recordings, which
        are published with the dataset. Needed before recording.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: onboarding_required or consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agree to record your voice
      tags:
      - data-lab
  /api/v1/data-lab/contributions:
    post:
      consumes:
      - application/json
      description: Saves a translation or answer as pending review, written or recorded.
        A recording (modality=audio) carries the audio_key it was uploaded to and
        an optional transcript in text. `pasted` is set by the editor when text was
        pasted in.
      parameters:
      - description: Contribution
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.contributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ContributionAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_contributed or language_closed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit a contribution
      tags:
      - data-lab
  /api/v1/data-lab/features:
    get:
      description: 'Which optional features this server has: voice is true when recordings
        can be stored.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.featuresResponse'
      summary: Data Lab features
      tags:
      - data-lab
  /api/v1/data-lab/languages:
    get:
      description: 'Returns the enabled languages: the target languages volunteers
        contribute in, then the source languages.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Data Lab languages
      tags:
      - data-lab
  /api/v1/data-lab/me:
    get:
      description: Returns the volunteer's languages, levels, and consent. 403 onboarding_required
        when they have not joined yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my Data Lab profile
      tags:
      - data-lab
  /api/v1/data-lab/onboarding:
    post:
      consumes:
      - application/json
      description: Records the volunteer's name, languages, and acceptance of the
        current consent. Calling it again adds languages and never lowers a level.
      parameters:
      - description: Onboarding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.onboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VolunteerAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: consent_required
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Join the Data Lab or add languages
      tags:
      - data-lab
  /api/v1/data-lab/progress:
    get:
      description: Verified and pending counts, members, reviewers, and whether each
        target language is open. Signed-in clients also receive data-lab.progress
        messages on /ws as counts change.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.LanguageProgressAlias'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Live progress per language
      tags:
      - data-lab
  /api/v1/data-lab/recordings:
    post:
      consumes:
      - application/json
      description: Returns a presigned URL (valid 15 minutes) the browser PUTs the
        recording to, with the returned content_type, then the key to submit with
        the contribution. Needs voice consent.
      parameters:
      - description: Recording
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.recordingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RecordingUploadAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: voice_consent_required
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: voice_unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a URL to upload a recording to
      tags:
      - data-lab
  /api/v1/data-lab/reviews:
    post:
      consumes:
      - application/json
      description: Accept verifies the contribution. Correct verifies it with the
        reviewer's corrected_text (for a recording, the corrected or added transcript),
        keeping the original on the contribution. Reject needs a reason (inaccurate,
        incomplete, machine_translated, off_topic, other) and reopens the item for
        others.
      parameters:
      - description: Review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.reviewRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: not_reviewer or own_contribution
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: already_reviewed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Review a contribution
      tags:
      - data-lab
  /api/v1/data-lab/reviews/next:
    get:
      description: Returns the oldest pending contribution in the language by someone
        else. A recording comes with audio_url to play it and its transcript (possibly
        empty) in text. 404 no_reviews when the queue is empty.
      parameters:
      - description: Language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReviewItemAlias'
        "403":
          description: not_reviewer
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_reviews
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next contribution to review
      tags:
      - data-lab
  /api/v1/data-lab/tasks/next:
    get:
      description: Returns an item to translate or a prompt to answer, to write (modality=text,
        the default) or to say (modality=audio). Text and voice are tracked separately.
        404 no_tasks when the language has nothing left for this volunteer; 409 language_closed
        until it has two reviewers.
      parameters:
      - description: Target language code, e.g. sw
        in: query
        name: language
        required: true
        type: string
      - description: text (default) or audio
        in: query
        name: modality
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskAlias'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: no_tasks
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: language_closed
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: voice_unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the next task in a language
      tags:
      - data-lab
  /api/v1/me:
    delete:
      description: Removes the authenticated user's profile record from the database.
        The Firebase account is not deleted.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - users
    get:
      description: 'Returns the authenticated Firebase user''s decoded claims. Requires
        Authorization: Bearer <firebase-id-token>.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FirebaseToken'
        "401":
          description: Missing or invalid token
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Upserts the authenticated user's profile record. Requires a valid
        Firebase ID token.
      parameters:
      - description: Profile update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserAlias'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthStats'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.HealthStats'
      summary: Health check
      tags:
      - ops
  /metrics:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus exposition format
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - observability
  /ws:
    get:
      description: Upgrades HTTP to WebSocket. Pass a Firebase ID token as `?token=<token>`.
        Returns 401 when the token is missing or invalid.
      parameters:
      - description: Firebase ID token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a WebSocket connection
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    description: Firebase ID token — prefix with "Bearer "
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
