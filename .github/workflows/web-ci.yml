name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # The pages read their content from Sanity at build time. Not
          # secrets: the dataset is public (web/docs/cms.md).
          NEXT_PUBLIC_SANITY_PROJECT_ID: 8m5302r8
          NEXT_PUBLIC_SANITY_DATASET: production
